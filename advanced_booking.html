<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SN Kohlarn - ระบบจองห้องพัก</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* [cite: 1] โครงสร้าง CSS เดิมของคุณทนาย */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Sarabun', sans-serif; background: #f4f7f6; color: #333; padding: 20px; }
.container { max-width: 1100px; margin: auto; }
.header { background: linear-gradient(135deg,#1DB446,#158d35); color: white; padding: 30px; border-radius: 14px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
.header h1 { font-size: 32px; margin-bottom: 10px; }
.booking-card { background: white; border-radius: 14px; padding: 25px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,.08); }
.section-title { font-size: 22px; margin-bottom: 20px; color: #1DB446; border-bottom: 2px solid #eee; padding-bottom: 10px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit,minmax(300px,1fr)); gap: 20px; }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }

/* ส่วนแสดงผลวิดีโอ */
.room-video-container { width: 100%; height: 200px; overflow: hidden; background: #000; border-radius: 12px 12px 0 0; }
.room-video-container video { width: 100%; height: 100%; object-fit: cover; }

.room-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(280px,1fr)); gap: 18px; }
.room-card { border: 1px solid #ddd; border-radius: 12px; overflow: hidden; background: #fff; }
.room-content { padding: 18px; }
.badge { display: inline-block; background: #e8f5e9; color: #158d35; padding: 5px 12px; border-radius: 100px; font-size: 12px; font-weight: 700; }
.qty-control { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
.qty-control button { width: 36px; height: 36px; border: none; border-radius: 50%; background: #1DB446; color: white; cursor: pointer; }
.qty-control input { width: 60px; text-align: center; border: none; font-weight: bold; }
.summary-box { background: #f8fff9; border: 1px solid #c7efcf; border-radius: 12px; padding: 20px; margin-top: 20px; }
.alert { padding: 15px; border-radius: 10px; margin-top: 15px; font-weight: bold; display: none; }
.alert-danger { background: #fff0f0; color: #c62828; }
.alert-success { background: #effff3; color: #2e7d32; }
.btn { border: none; border-radius: 10px; padding: 14px 22px; cursor: pointer; font-weight: 700; transition: .3s; }
.btn-primary { background: #1DB446; color: white; width: 100%; }
.loading { display: none; text-align: center; padding: 20px; }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🏝️ SN Kohlarn Booking System</h1>
        <p>ระบุรายละเอียดการเข้าพักเพื่อรับใบยืนยันการจองผ่าน Facebook</p>
    </div>

    <div class="booking-card">
        <div class="section-title">ข้อมูลผู้เข้าพัก</div>
        <div class="grid-2">
            <div>
                <div class="form-group"><label>ชื่อผู้ติดต่อ</label><input type="text" id="customerName" placeholder="กรอกชื่อผู้จอง"></div>
                <div class="form-group"><label>เบอร์โทรศัพท์</label><input type="tel" id="phone" placeholder="08x-xxx-xxxx"></div>
                <div class="form-group"><label>Facebook Name</label><input type="text" id="facebookName" placeholder="ระบุชื่อ Facebook เพื่อส่งสรุปข้อมูล"></div>
            </div>
            <div>
                <div class="form-group"><label>วันที่ Check-in</label><input type="date" id="checkinDate"></div>
                <div class="form-group"><label>วันที่ Check-out</label><input type="date" id="checkoutDate"></div>
            </div>
        </div>
    </div>

    <div class="booking-card">
        <div class="section-title">จำนวนผู้เข้าพัก</div>
        <div class="grid-2">
            <div class="form-group"><label>ผู้ใหญ่</label><input type="number" id="adultCount" min="1" value="2" onchange="calculateCapacity()"></div>
            <div class="form-group"><label>เด็กอายุ 4 - 6 ปี</label><input type="number" id="kidLarge" min="0" value="0" onchange="calculateCapacity()"></div>
            <div class="form-group"><label>เด็กอายุ 0 - 3 ปี (พักฟรี)</label><input type="number" id="kidSmall" min="0" value="0"></div>
            <div class="form-group"><label>สัตว์เลี้ยง</label><select id="petStatus"><option value="ไม่มี">ไม่มี</option><option value="มี">มี</option></select></div>
        </div>
        <div id="guestSummary" class="summary-box"></div>
    </div>

    <div class="booking-card">
        <div class="section-title">เลือกห้องพัก (ชมวิดีโอแต่ละประเภท)</div>
        <div class="room-grid">
            <div class="room-card">
                <div class="room-video-container">
                    <video autoplay muted loop playsinline><source src="std-1.mp4" type="video/mp4"></video>
                </div>
                <div class="room-content">
                    <div class="badge">Standard</div><h3 class="room-title">Standard Room</h3>
                    <div class="qty-control">
                        <button onclick="decreaseRoom('standardQty')">-</button>
                        <input type="number" id="standardQty" value="0" min="0" readonly>
                        <button onclick="increaseRoom('standardQty')">+</button>
                    </div>
                </div>
            </div>
            <div class="room-card">
                <div class="room-video-container">
                    <video autoplay muted loop playsinline><source src="jac-1.mp4" type="video/mp4"></video>
                </div>
                <div class="room-content">
                    <div class="badge">Jacuzzi</div><h3 class="room-title">Jacuzzi Room</h3>
                    <div class="qty-control">
                        <button onclick="decreaseRoom('jacuzziQty')">-</button>
                        <input type="number" id="jacuzziQty" value="0" min="0" readonly>
                        <button onclick="increaseRoom('jacuzziQty')">+</button>
                    </div>
                </div>
            </div>
            <div class="room-card">
                <div class="room-video-container">
                    <video autoplay muted loop playsinline><source src="fam-1.mp4" type="video/mp4"></video>
                </div>
                <div class="room-content">
                    <div class="badge">Family</div><h3 class="room-title">Family Room</h3>
                    <div class="qty-control">
                        <button onclick="decreaseRoom('familyQty')">-</button>
                        <input type="number" id="familyQty" value="0" min="0" readonly>
                        <button onclick="increaseRoom('familyQty')">+</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="roomAlert" class="alert alert-danger"></div>
    </div>

    <div class="booking-card">
        <div class="section-title">บริการเสริม</div>
        <div class="form-group">
            <label><input type="checkbox" id="motorbikeService"> 🛵 ต้องการเช่ามอเตอร์ไซค์ (300.-/วัน)</label>
        </div>
    </div>

    <div class="booking-card">
        <div class="section-title">คำขอเพิ่มเติม</div>
        <div class="form-group">
            <textarea id="specialRequest" rows="4" placeholder="เช่น ขอห้องชั้นล่าง หรือ แจ้งเวลาเดินทางถึงท่าเรือ"></textarea>
        </div>
    </div>

    <div class="booking-card">
        <div id="validationAlert" class="alert alert-danger"></div>
        <div id="successAlert" class="alert alert-success"></div>
        <button class="btn btn-primary" id="submitBtn" onclick="submitBooking()">ยืนยันข้อมูลการจอง</button>
        <div class="loading" id="loadingBox"><p>⏳ กำลังส่งข้อมูลไปยังแอดมิน...</p></div>
    </div>
</div>

<script>
// [cite: 111] เปลี่ยน URL เป็น Web App ของคุณทนายเอง
const GOOGLE_SCRIPT_URL = 'YOUR_WEB_APP_URL_HERE';

function increaseRoom(id) { const input = document.getElementById(id); input.value = parseInt(input.value) + 1; calculateCapacity(); }
function decreaseRoom(id) { const input = document.getElementById(id); if(parseInt(input.value) > 0) { input.value = parseInt(input.value) - 1; } calculateCapacity(); }

function calculateCapacity() {
    const adults = parseInt(document.getElementById('adultCount').value) || 0;
    const kidLarge = parseInt(document.getElementById('kidLarge').value) || 0;
    const standardQty = parseInt(document.getElementById('standardQty').value) || 0;
    const jacuzziQty = parseInt(document.getElementById('jacuzziQty').value) || 0;
    const familyQty = parseInt(document.getElementById('familyQty').value) || 0;
    const totalCapacity = (standardQty * 2) + (jacuzziQty * 2) + (familyQty * 3);
    const guestTotal = adults + kidLarge;
    
    const roomAlert = document.getElementById('roomAlert');
    if(totalCapacity > 0 && totalCapacity < guestTotal) {
        roomAlert.style.display = 'block';
        roomAlert.innerHTML = `⚠️ จำนวนที่นอนไม่พอสำหรับ ${guestTotal} ท่าน (เลือกไว้จุได้แค่ ${totalCapacity} ท่าน)`;
    } else { roomAlert.style.display = 'none'; }
    
    document.getElementById('guestSummary').innerHTML = `<h3>สรุป: ผู้เข้าพัก ${guestTotal} ท่าน | ห้องรวม ${standardQty + jacuzziQty + familyQty} ห้อง</h3>`;
}

async function submitBooking() {
    const name = document.getElementById('customerName').value;
    if(!name || !document.getElementById('checkinDate').value) { alert("กรุณากรอกชื่อและเลือกวันเข้าพักค่ะ"); return; }
    
    document.getElementById('loadingBox').style.display = 'block';
    document.getElementById('submitBtn').style.display = 'none';

    // 🌟 ดึง psid จาก URL เพื่อใช้ส่งข้อความกลับ Facebook [cite: 143]
    const psid = new URLSearchParams(window.location.search).get('psid');

    const payload = {
        action: "advancedBooking", // [cite: 140]
        psid: psid,
        customerName: name,
        phone: document.getElementById('phone').value,
        facebook: document.getElementById('facebookName').value,
        checkinDate: document.getElementById('checkinDate').value,
        checkoutDate: document.getElementById('checkoutDate').value,
        adults: document.getElementById('adultCount').value,
        kidsSmall: document.getElementById('kidSmall').value,
        kidsLarge: document.getElementById('kidLarge').value,
        pet: document.getElementById('petStatus').value,
        standardRoom: document.getElementById('standardQty').value,
        jacuzziRoom: document.getElementById('jacuzziQty').value,
        familyRoom: document.getElementById('familyQty').value,
        motorbike: document.getElementById('motorbikeService').checked,
        // ส่งค่า false สำหรับบริการที่ลบออกเพื่อคงโครงสร้างฐานข้อมูล [cite: 128]
        breakfast: false, pickup: false, seaTrip: false, birthday: false, honeymoon: false,
        specialRequest: document.getElementById('specialRequest').value,
        bookingStatus: 'Pending'
    };

    try {
        await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
        document.getElementById('loadingBox').style.display = 'none';
        document.getElementById('successAlert').style.display = 'block';
        document.getElementById('successAlert').innerHTML = "✅ สำเร็จ! ข้อมูลถูกส่งไปยังแอดมินและแชท Facebook ของคุณแล้วค่ะ";
    } catch(e) { alert("เกิดข้อผิดพลาด กรุณาลองใหม่ค่ะ"); }
}
window.onload = calculateCapacity;
</script>
</body>
</html>

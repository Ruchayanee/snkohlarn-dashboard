<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SN Kohlarn - ระบบจองห้องพัก</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* โครงสร้าง CSS สำหรับ SN Kohlarn */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Sarabun', sans-serif; background: #f4f7f6; color: #333; padding: 20px; }
.container { max-width: 1200px; margin: auto; }
.header { background: linear-gradient(135deg,#1DB446,#158d35); color: white; padding: 30px; border-radius: 14px; margin-bottom: 20px; text-align: center; }
.booking-card { background: white; border-radius: 14px; padding: 25px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,.08); }
.section-title { font-size: 22px; margin-bottom: 20px; color: #1DB446; border-bottom: 2px solid #eee; padding-bottom: 10px; font-weight: bold; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit,minmax(300px,1fr)); gap: 20px; }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }

/* ส่วนวิดีโอ ดึงจาก images/images/ ตามโครงสร้างของคุณทนาย */
.room-video-container { width: 100%; height: 200px; overflow: hidden; background: #000; border-radius: 12px 12px 0 0; }
.room-video-container video { width: 100%; height: 100%; object-fit: cover; }

.room-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(250px,1fr)); gap: 15px; }
.room-card { border: 1px solid #ddd; border-radius: 12px; overflow: hidden; background: #fff; transition: 0.3s; }
.room-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
.room-content { padding: 15px; }
.badge { display: inline-block; background: #e8f5e9; color: #158d35; padding: 4px 10px; border-radius: 100px; font-size: 11px; font-weight: 700; margin-bottom: 5px; }
.qty-control { display: flex; gap: 8px; align-items: center; margin-top: 10px; justify-content: center; }
.qty-control button { width: 35px; height: 35px; border: none; border-radius: 50%; background: #1DB446; color: white; cursor: pointer; font-size: 18px; }
.qty-control input { width: 45px; text-align: center; border: none; font-weight: bold; font-size: 16px; background: transparent; }

.summary-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; padding: 15px; margin-top: 15px; }
.alert { padding: 15px; border-radius: 10px; margin-top: 15px; font-weight: bold; display: none; }
.btn-primary { background: #1DB446; color: white; width: 100%; border: none; border-radius: 10px; padding: 16px; cursor: pointer; font-weight: 700; font-size: 18px; }
.loading { display: none; text-align: center; padding: 20px; }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🏝️ SN Kohlarn Booking</h1>
        <p>ระบุข้อมูลเพื่อรับใบยืนยันการจองผ่าน Facebook</p>
    </div>

    <div class="booking-card">
        <div class="section-title">ข้อมูลผู้เข้าพัก</div>
        <div class="grid-2">
            <div>
                <div class="form-group"><label>ชื่อผู้ติดต่อ</label><input type="text" id="customerName" placeholder="ชื่อ-นามสกุล"></div>
                <div class="form-group"><label>เบอร์โทรศัพท์</label><input type="tel" id="phone" placeholder="08x-xxx-xxxx"></div>
                <div class="form-group"><label>Facebook Name</label><input type="text" id="facebookName" placeholder="ชื่อเฟซบุ๊กของคุณ"></div>
            </div>
            <div>
                <div class="form-group"><label>วันที่ Check-in</label><input type="date" id="checkinDate"></div>
                <div class="form-group"><label>วันที่ Check-out</label><input type="date" id="checkoutDate"></div>
            </div>
        </div>
    </div>

    <div class="booking-card">
        <div class="section-title">เลือกประเภทห้องพัก (ชมวิดีโอ)</div>
        <div class="room-grid">
            <div class="room-card">
                <div class="room-video-container">
                    <video autoplay muted loop playsinline poster="images/images/std-1.jpg">
                        <source src="images/images/std-1.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="room-content">
                    <div class="badge">Standard</div><h3 style="font-size:16px;">Standard Room</h3>
                    <div class="qty-control">
                        <button onclick="changeQty('standardQty', -1)">-</button>
                        <input type="number" id="standardQty" value="0" min="0" readonly>
                        <button onclick="changeQty('standardQty', 1)">+</button>
                    </div>
                </div>
            </div>

            <div class="room-card">
                <div class="room-video-container">
                    <video autoplay muted loop playsinline poster="images/images/jac-1.jpg">
                        <source src="images/images/jac-1.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="room-content">
                    <div class="badge">Jacuzzi</div><h3 style="font-size:16px;">Jacuzzi Room</h3>
                    <div class="qty-control">
                        <button onclick="changeQty('jacuzziQty', -1)">-</button>
                        <input type="number" id="jacuzziQty" value="0" min="0" readonly>
                        <button onclick="changeQty('jacuzziQty', 1)">+</button>
                    </div>
                </div>
            </div>

            <div class="room-card">
                <div class="room-video-container">
                    <video autoplay muted loop playsinline poster="images/images/fam-1.jpg">
                        <source src="images/images/fam-1.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="room-content">
                    <div class="badge">Family</div><h3 style="font-size:16px;">Family Room</h3>
                    <div class="qty-control">
                        <button onclick="changeQty('familyQty', -1)">-</button>
                        <input type="number" id="familyQty" value="0" min="0" readonly>
                        <button onclick="changeQty('familyQty', 1)">+</button>
                    </div>
                </div>
            </div>

            <div class="room-card">
                <div class="room-video-container">
                    <video autoplay muted loop playsinline poster="images/images/sea-1.jpg">
                        <source src="images/images/sea-1.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="room-content">
                    <div class="badge">Sea View</div><h3 style="font-size:16px;">Sea View Room</h3>
                    <div class="qty-control">
                        <button onclick="changeQty('seaQty', -1)">-</button>
                        <input type="number" id="seaQty" value="0" min="0" readonly>
                        <button onclick="changeQty('seaQty', 1)">+</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="roomAlert" class="alert" style="background:#fee2e2; color:#b91c1c;"></div>
    </div>

    <div class="booking-card">
        <div class="section-title">บริการเสริม</div>
        <label style="font-size: 18px; cursor: pointer;">
            <input type="checkbox" id="motorbikeService" style="width: 20px; height: 20px; vertical-align: middle;"> 🛵 เช่ามอเตอร์ไซค์ (300.-/วัน)
        </label>
    </div>

    <div class="booking-card">
        <div id="successAlert" class="alert" style="background:#dcfce7; color:#15803d; display:none;"></div>
        <button class="btn btn-primary" id="submitBtn" onclick="submitBooking()">ยืนยันข้อมูลการจอง</button>
        <div class="loading" id="loadingBox"><p>⏳ กำลังส่งข้อมูลเข้าแชทเฟซบุ๊ก...</p></div>
    </div>
</div>

<script>
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzKj6d7mAV-9SVvIKHA1SyWMJcUFMQ5241Mz5xWTLMtOaPRQgfQFfdaGOqOHRkrShd5/exec';

function changeQty(id, val) {
    const input = document.getElementById(id);
    let newFullVal = parseInt(input.value) + val;
    if (newFullVal >= 0) input.value = newFullVal;
}

async function submitBooking() {
    const name = document.getElementById('customerName').value;
    const checkin = document.getElementById('checkinDate').value;
    if(!name || !checkin) { alert("กรุณาระบุชื่อและวันที่เข้าพักด้วยนะคะ"); return; }
    
    document.getElementById('loadingBox').style.display = 'block';
    document.getElementById('submitBtn').style.display = 'none';

    const psid = new URLSearchParams(window.location.search).get('psid');

    const payload = {
        action: "advancedBooking",
        psid: psid,
        customerName: name,
        phone: document.getElementById('phone').value,
        facebook: document.getElementById('facebookName').value,
        checkinDate: checkin,
        checkoutDate: document.getElementById('checkoutDate').value,
        standardRoom: document.getElementById('standardQty').value,
        jacuzziRoom: document.getElementById('jacuzziQty').value,
        familyRoom: document.getElementById('familyQty').value,
        seaRoom: document.getElementById('seaQty').value, // เพิ่มหมวด Sea Room
        motorbike: document.getElementById('motorbikeService').checked,
        bookingStatus: 'Pending'
    };

    try {
        await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
        document.getElementById('loadingBox').style.display = 'none';
        document.getElementById('successAlert').style.display = 'block';
        document.getElementById('successAlert').innerHTML = "✅ เรียบร้อยค่ะ! ข้อมูลจองถูกส่งเข้าแชท Facebook ของคุณแล้ว";
    } catch(e) { 
        alert("เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้งนะคะ");
        document.getElementById('loadingBox').style.display = 'none';
        document.getElementById('submitBtn').style.display = 'block';
    }
}
</script>
</body>
</html>

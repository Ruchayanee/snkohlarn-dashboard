<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จองที่พัก - SN Kohlarn</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1DB446;
            --primary-dark: #158d35;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --radius: 20px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            line-height: 1.6;
            padding: 15px;
        }

        .container { max-width: 800px; margin: 0 auto; }

        /* Header ธีมเดียวกับ Gallery */
        .header-banner {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            padding: 40px 20px;
            border-radius: var(--radius);
            text-align: center;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
        }

        .header-banner h1 { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
        .header-banner p { font-size: 14px; opacity: 0.9; font-weight: 300; }

        /* Card Style */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.8);
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Input Style ธีมทันสมัย */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 500px) { .form-grid { grid-template-columns: 1fr; } }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-sub); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-main);
            transition: all 0.3s;
            background: #fdfdfd;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(29, 180, 70, 0.1);
            outline: none;
        }

        /* Room Selection แบบ Gallery */
        .room-scroll {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .room-item {
            background: #fff;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #f1f5f9;
            transition: transform 0.3s;
        }

        .video-box {
            width: 100%;
            height: 140px;
            background: #000;
            position: relative;
        }

        .video-box video { width: 100%; height: 100%; object-fit: cover; }

        .room-info { padding: 15px; text-align: center; }
        .room-name { font-size: 15px; font-weight: 600; margin-bottom: 10px; }

        /* ตัวเลขปรับจำนวน */
        .qty-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-qty {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: #f1f5f9;
            color: var(--text-main);
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-qty:active { background: var(--primary-color); color: white; }

        .qty-val { font-weight: 700; font-size: 16px; width: 25px; text-align: center; }

        /* บริการเสริม */
        .service-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 12px;
            cursor: pointer;
        }

        .service-item input { width: 18px; height: 18px; accent-color: var(--primary-color); }

        /* ปุ่มยืนยัน */

            width: 100%;
            padding: 18px;
            border-radius: 15px;
            border: none;

            color: white;

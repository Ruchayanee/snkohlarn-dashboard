<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> luxury จองที่พัก - SN Kohlarn</title>
    <link href="https://fonts.googleapis.com/css2?family=Prata&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* ธีมสีน้ำเงินเข้มและครีม */
            --navy-deep: #1A365D;
            --cream-bg: #FAF0E6; 
            --white-bg: #FAF0E6;
            --text-main: #1A365D;
            --text-sub: #64748b;
            --radius-main: 25px;
            --radius-item: 15px;
            /* เงาฟุ้งๆ (Soft Shadow) */
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: var(--cream-bg); 
            color: var(--text-main);
            line-height: 1.6;
            padding: 15px;
        }

        /* หรูหราตัวหนังสือหัวเรื่อง */
        h1, .room-name, .btn-submit { font-family: 'Prata', serif; }

        .container { max-width: 800px; margin: 0 auto; }

        /* Header หรูหราดีไซน์อัลบั้ม */
        .header-banner {
            background-color: var(--navy-deep);
            color: var(--white-bg);
            padding: 50px 20px;
            border-radius: var(--radius-main);
            text-align: center;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            border: 2px solid var(--navy-deep);
        }

        .header-banner h1 { font-size: 32px; font-weight: 700; margin-bottom: 12px; }
        .header-banner p { font-size: 14px; opacity: 0.9; font-weight: 300; }

        /* Card Style - ขอบ Card เป็นเส้นสีน้ำเงินเข้ม */
        .card {
            background-color: var(--white-bg);
            border-radius: var(--radius-main);
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            border: 2px solid var(--navy-deep);
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--navy-deep);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Input Style หรูหราทันสมัย */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 500px) { .form-grid { grid-template-columns: 1fr; } }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid var(--navy-deep);
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-main);
            transition: all 0.3s;
            background: #fff;
        }

        /* Room Selection ดีไซน์อัลบั้มพรีเมียม */
        .room-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .room-item {
            background: #fff;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid var(--navy-deep);
            transition: transform 0.3s;
        }

        .video-box {
            width: 100%;
            height: 160px;
            background: #000;
            position: relative;
        }

        .video-box video { width: 100%; height: 100%; object-fit: cover; }

        .room-info { padding: 20px; text-align: center; }
        .room-name { font-size: 18px; font-weight: 600; margin-bottom: 15px; color: var(--navy-deep); }

        /* ตัวนับจำนวนแบบหรูหรา */
        .qty-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .btn-qty {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1.5px solid var(--navy-deep);
            background: var(--white-bg);
            color: var(--navy-deep);
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .qty-val { font-weight: 700; font-size: 22px; width: 30px; text-align: center; color: var(--navy-deep); }

        /* บริการเสริม */
        .service-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: var(--white-bg);
            border-radius: 15px;
            cursor: pointer;
            border: 1.5px solid var(--navy-deep);
        }

        .service-item input { width: 22px; height: 22px; accent-color: var(--navy-deep); }
        .service-item span { font-size: 16px; color: var(--navy-deep); }

        /* ปุ่มยืนยันหรูหราแบบไล่เฉดสี */
        .btn-submit {
            width: 100%;
            padding: 20px;
            border-radius: var(--radius-main);
            border: none;
            background: linear-gradient(135deg, var(--navy-deep), #2A467D);
            color: var(--white-bg);
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 20px -10px rgba(26, 54, 93, 0.5);
            transition: 0.3s;
        }

        .btn-submit:active { transform: scale(0.98); }

        .loading-overlay {
            display: none;
            text-align: center;
            padding: 25px;
            font-weight: 600;
            color: var(--navy-deep);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-banner">
        <h1>SN KOHLARN</h1>
        <p>อัจฉริยะระบบแจ้งข้อมูลการเข้าพัก</p>
    </div>

    <div class="card">
        <div class="section-title">👤 ข้อมูลผู้ติดต่อ</div>
        <div class="form-group">
            <label>ชื่อ-นามสกุล</label>
            <input type="text" id="customerName" placeholder="กรอกชื่อผู้จอง">
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label>เบอร์โทรศัพท์</label>
                <input type="tel" id="phone" placeholder="08x-xxx-xxxx">
            </div>
            <div class="form-group">
                <label>ชื่อ Facebook</label>
                <input type="text" id="facebookName" placeholder="ระบุชื่อเฟซบุ๊กเพื่อส่งสรุปข้อมูล">
            </div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">📅 เลือกวันเข้าพัก</div>
        <div class="form-grid">
            <div class="form-group">
                <label>เช็คอิน (Check-in)</label>
                <input type="date" id="checkinDate">
            </div>
            <div class="form-group">
                <label>เช็คเอาท์ (Check-out)</label>
                <input type="date" id="checkoutDate">
            </div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">🛏️ เลือกห้องพัก</div>
        <div class="room-grid">
            <div class="room-item">
                <div class="video-box">
                    <video autoplay muted loop playsinline poster="images/images/std-1.jpg">
                        <source src="images/images/std-1.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="room-info">
                    <div class="room-name">Standard Room</div>
                    <div class="qty-wrap">
                        <button class="btn-qty" onclick="changeQty('standardQty', -1)">-</button>
                        <span class="qty-val" id="standardQty">0</span>
                        <button class="btn-qty" onclick="changeQty('standardQty', 1)">+</button>
                    </div>
                </div>
            </div>
            <div class="room-item">
                <div class="video-box">
                    <video autoplay muted loop playsinline poster="images/images/jac-1.jpg">
                        <source src="images/images/jac-1.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="room-info">
                    <div class="room-name">Jacuzzi Room</div>
                    <div class="qty-wrap">
                        <button class="btn-qty" onclick="changeQty('jacuzziQty', -1)">-</button>
                        <span class="qty-val" id="jacuzziQty">0</span>
                        <button class="btn-qty" onclick="changeQty('jacuzziQty', 1)">+</button>
                    </div>
                </div>
            </div>
            <div class="room-item">
                <div class="video-box">
                    <video autoplay muted loop playsinline poster="images/images/fam-1.jpg">
                        <source src="images/images/fam-1.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="room-info">
                    <div class="room-name">Family Room</div>
                    <div class="qty-wrap">
                        <button class="btn-qty" onclick="changeQty('familyQty', -1)">-</button>
                        <span class="qty-val" id="familyQty">0</span>
                        <button class="btn-qty" onclick="changeQty('familyQty', 1)">+</button>
                    </div>
                </div>
            </div>
            <div class="room-item">
                <div class="video-box">
                    <video autoplay muted loop playsinline poster="images/images/sea-1.jpg">
                        <source src="images/images/sea-1.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="room-info">
                    <div class="room-name">Sea View Room</div>
                    <div class="qty-wrap">
                        <button class="btn-qty" onclick="changeQty('seaQty', -1)">-</button>
                        <span class="qty-val" id="seaQty">0</span>
                        <button class="btn-qty" onclick="changeQty('seaQty', 1)">+</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">🛵 บริการเพิ่มเติม</div>
        <label class="service-item">
            <input type="checkbox" id="motorbikeService">
            <span>เช่ามอเตอร์ไซค์ (300.- / วัน)</span>
        </label>
    </div>

    <div style="margin-bottom: 60px;">
        <button class="btn-submit" id="submitBtn" onclick="submitBooking()">ยืนยันการแจ้งจอง</button>
        <div class="loading-overlay" id="loadingBox">⌛ กำลังบันทึกข้อมูล...</div>
    </div>
</div>

<script>
    // URL Web App ตัวจริงของคุณทนาย
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzKj6d7mAV-9SVvIKHA1SyWMJcUFMQ5241Mz5xWTLMtOaPRQgfQFfdaGOqOHRkrShd5/exec';

    const roomData = { standardQty: 0, jacuzziQty: 0, familyQty: 0, seaQty: 0 };

    function changeQty(id, val) {
        roomData[id] = Math.max(0, roomData[id] + val);
        document.getElementById(id).innerText = roomData[id];
    }

    async function submitBooking() {
        const name = document.getElementById('customerName').value;
        const cin = document.getElementById('checkinDate').value;
        if(!name || !cin) { alert("กรุณาระบุชื่อและวันที่เช็คอินด้วยนะคะ"); return; }

        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('loadingBox').style.display = 'block';

        // ดึง Facebook PSID เพื่อใช้ส่งข้อความกลับ
        const psid = new URLSearchParams(window.location.search).get('psid');

        const payload = {
            action: "advancedBooking", //
            psid: psid, // ส่งรหัสลับลูกค้ารายนี้กลับไปด้วยครับ
            customerName: name,
            phone: document.getElementById('phone').value,
            facebook: document.getElementById('facebookName').value,
            checkinDate: cin,
            checkoutDate: document.getElementById('checkoutDate').value,
            standardRoom: roomData.standardQty,
            jacuzziRoom: roomData.jacuzziQty,
            familyRoom: roomData.familyQty,
            seaRoom: roomData.seaQty,
            motorbike: document.getElementById('motorbikeService').checked,
            bookingStatus: 'Pending',
            specialRequest: "จองผ่านดีไซน์อัลบั้มสุดหรู"
        };

        try {
            await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            alert("✅ ส่งข้อมูลสำเร็จ! ระบบกำลังส่งสรุปเข้าแชท Facebook ของคุณนะคะ");
            location.reload();
        } catch(e) {
            alert("❌ เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้งค่ะ");
            document.getElementById('submitBtn').style.display = 'block';
            document.getElementById('loadingBox').style.display = 'none';
        }
    }
</script>
</body>
</html>

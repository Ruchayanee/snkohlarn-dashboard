<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SN Koh Larn - Super App</title>
    
    <link rel="apple-touch-icon" href="https://i.postimg.cc/K8NJswRQ/SN-LOGOAPP.jpg">
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/K8NJswRQ/SN-LOGOAPP.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif; 
            background-color: #f8f5f2; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            text-align: center;
            padding: 20px;
            position: relative;
        }
        .subtitle { 
            color: #777; 
            font-size: 22px; 
            margin-top: -55px; /* ชิดโลโก้ขึ้นไป */
            margin-bottom: 12px; 
            letter-spacing: 0.5px;
            font-weight: 600; 
        }
        .btn-app {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            width: 100%; max-width: 380px; padding: 24px; margin-bottom: 14px; 
            font-size: 22px; 
            font-weight: bold; color: white; text-decoration: none;
            border-radius: 22px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        .btn-app:active { transform: scale(0.95); }
        .btn-book { background-color: #059669; }
        .btn-verify { background-color: #f39c12; } 
        .btn-dash { background-color: #1e293b; }

        .bell-container {
            position: absolute;
            top: 25px;
            right: 25px;
            font-size: 32px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .bell-badge {
            position: absolute;
            top: -5px;
            right: -8px;
            background-color: #ff3b30;
            color: white;
            border-radius: 50%;
            padding: 4px 10px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: none;
        }
    </style>
</head>
<body>

    <!-- ปุ่มกระดิ่ง (ทางลัดตรวจสอบการโอน) -->
    <a href="dashboard.html?tab=verify" class="bell-container">
        🔔<span class="bell-badge" id="slipBadge">0</span>
    </a>

    <!-- โลโก้ SN Kohlarn -->
    <img src="https://i.postimg.cc/zDw9HWXS/IMG-5036.jpg" alt="SN Kohlarn Logo" style="width: 320px; max-width: 95vw; margin: 0 auto 0 auto; display: block; mix-blend-mode: multiply;">
    
    <div class="subtitle">Super App Management System</div>

    <!-- เมนูหลัก -->
    <a href="dashboard.html" class="btn-app btn-dash">📊 ระบบบัญชี และ สต๊อก</a>
    <a href="booking.html" class="btn-app btn-book">📝 ระบบการจองห้องพัก</a>
    
    <!-- ปุ่มตรวจสอบการโอน (ต้องส่งค่า ?tab=verify ไปด้วย) -->
    <a href="dashboard.html?tab=verify" class="btn-app btn-verify">🔔 ตรวจสอบการโอนเงิน</a>

    <script>
        const PENDING_API_URL = "https://script.google.com/macros/s/AKfycbyLFO7dgjgdeDY5ETh7B_mV-bJG8T_tHnw-a41sOTfw9EKCoknUv2MJ2CP9yVJtL9CbfA/exec"; 

        async function checkPendingSlips() {
            if(!PENDING_API_URL) return;
            try {
                const response = await fetch(PENDING_API_URL + "?action=getPending");
                const result = await response.json();
                if (result.status === "success" && result.data) {
                    const pendingCount = result.data.filter(row => row[5] === "รอการตรวจสอบ").length;
                    const badge = document.getElementById("slipBadge");
                    if (pendingCount > 0) {
                        badge.innerText = pendingCount;
                        badge.style.display = "block";
                    } else {
                        badge.style.display = "none";
                    }
                }
            } catch (err) { console.log(err); }
        }

        checkPendingSlips();
        setInterval(checkPendingSlips, 15000); 
    </script>
</body>
</html>

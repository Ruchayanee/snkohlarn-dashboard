<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SN Koh Larn - Super App</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Kanit', sans-serif; 
            background-color: #f8f5f2; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            text-align: center;
            padding: 20px;
        }
        .title { color: #a68b6d; font-size: 36px; font-weight: bold; letter-spacing: 2px; margin-bottom: 5px; }
        .subtitle { color: #888; font-size: 16px; margin-bottom: 40px; }
        .btn-app {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; max-width: 350px; padding: 25px; margin-bottom: 20px;
            font-size: 20px; font-weight: bold; color: white; text-decoration: none;
            border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        .btn-app:active { transform: scale(0.95); }
        .btn-book { background-color: #059669; }
        .btn-dash { background-color: #1e293b; }
    </style>
</head>
<body>

    <div class="title">SN KOH LARN</div>
    <div class="subtitle">Super App Management System</div>

    <a href="dashboard.html" class="btn-app btn-dash">📊 ระบบบัญชี และ สต๊อก</a>
    <a href="booking.html" class="btn-app btn-book">📝 ระบบการจองห้องพัก</a>

</body>
</html>

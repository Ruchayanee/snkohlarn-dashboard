<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบการจอง SN Koh Larn</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --primary-brown: #a68b6d; --light-brown: #d7ccc8; --bg-color: #f8f5f2; --text-dark: #4e443f; --white: #ffffff; --accent-green: #6d8a7a; --orange: #e67e22; }
        body { font-family: 'Kanit', sans-serif; background-color: var(--bg-color); color: var(--text-dark); margin: 0; padding: 15px; }
        .container { max-width: 650px; margin: 10px auto; background: var(--white); padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(166, 139, 109, 0.15); }
        .btn-back-home { display: block; text-align: center; background-color: #e74c3c; color: white; text-decoration: none; padding: 10px; border-radius: 10px; font-weight: bold; margin-bottom: 20px; }
        .header { text-align: center; border-bottom: 2px solid var(--bg-color); padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { margin: 0; color: var(--primary-brown); font-size: 26px; letter-spacing: 2px; }
        .mode-selector { display: flex; flex-wrap: wrap; background: #eee; padding: 5px; border-radius: 12px; margin-bottom: 20px; gap: 5px; }
        .mode-btn { flex: 1; min-width: 80px; padding: 10px 5px; border-radius: 8px; border: none; cursor: pointer; font-family: 'Kanit'; transition: 0.3s; font-size: 13px; font-weight: 500; }
        .mode-btn.active { background: var(--primary-brown); color: white; }
        .admin-section { background: #eef2f7; padding: 15px; border-radius: 12px; border: 1px solid #d1d9e6; margin-bottom: 20px; }
        h3 { color: var(--primary-brown); font-size: 18px; border-left: 4px solid var(--primary-brown); padding-left: 10px; margin: 25px 0 10px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: 500; }
        input, select { width: 100%; padding: 12px; border: 1px solid #e0d9d5; border-radius: 10px; font-family: 'Kanit'; box-sizing: border-box; }
        .room-cb-label { display: inline-block; padding: 6px 12px; background: #f1f3f5; border-radius: 20px; font-size: 13px; cursor: pointer; margin: 4px 4px 0 0; border: 1px solid #dee2e6; color: #495057; }
        .room-cb-label.checked { background: #1DB446; color: white; border-color: #1DB446; font-weight: bold; }
        .room-cb-label.locked { background: #ffdddd; color: #d63031; border-color: #ffcccc; cursor: not-allowed; text-decoration: line-through; opacity: 0.6; }
        .booking-card { background: #fff; border: 1px solid #e0d9d5; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .btn-delete-card { background: #e74c3c; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; font-family: 'Kanit'; margin-top: 5px; }
        .btn-edit-card { background: #f39c12; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; font-family: 'Kanit'; }
        .slip-preview-container { background: #fff8e1; border: 2px solid #f39c12; padding: 15px; border-radius: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-back-home">🔙 กลับหน้าแรก</a>

    <div class="header">
        <h1>SN KOH LARN</h1>
        <p style="margin:0; font-size: 12px; color: #888;">ระบบจัดการการจองห้องพัก</p>
    </div>

    <!-- 🟢 ส่วนแจ้งเตือนข้อมูลสลิปจาก Dashboard 🟢 -->
    <div id="pendingSlipArea"></div>

    <div class="mode-selector">
        <button class="mode-btn active" id="modeBooking" onclick="switchMode('booking')">📝 ยืนยันจอง</button>
        <button class="mode-btn" id="modeManage" onclick="switchMode('manage')">📋 ระบบจัดการการจอง</button>
    </div>

    <!-- ส่วนที่ 1: หน้าฟอร์มยืนยันจอง -->
    <div id="bookingFields">
        <div class="admin-section">
            <h3 style="margin-top:0; color: #d35400;">🏷️ ประเภทการจอง</h3>
            <select id="bookingChannel" onchange="toggleWalkinMode()">
                <option value="online">📱 จองออนไลน์ (ส่งข้อมูลเข้า LINE ลูกค้า)</option>
                <option value="walkin">🚶‍♂️ ลูกค้า Walk-in หน้ารีสอร์ต</option>
            </select>
        </div>

        <div id="customerInfoGroup">
            <h3>👤 ข้อมูลลูกค้า</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group"><label>ชื่อลูกค้า</label><input type="text" id="custName" placeholder="ชื่อลูกค้า"></div>
                <div class="form-group"><label>เบอร์โทรศัพท์</label><input type="text" id="contactSource" placeholder="เบอร์โทร"></div>
            </div>
            <div class="form-group" id="lineNameGroup">
                <label style="color: #27ae60;">💬 ชื่อ LINE ลูกค้า</label>
                <input type="text" id="lineName" placeholder="พิมพ์ชื่อให้ตรงกับใน LINE">
            </div>
        </div>

        <h3>📅 วันที่เข้าพัก <span id="loadingRooms" style="display:none; font-size:12px; color:orange;">⏳ กำลังเช็คสถานะห้อง...</span></h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group"><label>เช็คอิน</label><input type="date" id="checkIn" onchange="fetchBookedRooms()"></div>
            <div class="form-group"><label>เช็คเอ้าท์</label><input type="date" id="checkOut" onchange="fetchBookedRooms()"></div>
        </div>

        <h3>🏠 เลือกห้องพัก</h3>
        <div id="roomRowsContainer">
            <div class="room-row" style="background:#fff; padding:15px; border-radius:12px; border:1px solid #ddd; margin-bottom:10px;">
                <div style="display:flex; gap:10px; margin-bottom:10px;">
                    <select class="mainRoomType" onchange="handleRoomTypeChange(this)" style="flex:2;">
                        <option value="std">Standard (1,900)</option>
                        <option value="fam">Family (2,900)</option>
                        <option value="sea">Seaview (2,900)</option>
                        <option value="jac">Jacuzzi (3,500)</option>
                    </select>
                    <input type="number" class="roomPriceInput" placeholder="ราคา" style="flex:1;">
                    <input type="number" class="roomCount" value="0" readonly style="flex:0.5; background:#eee;">
                </div>
                <div class="checkbox-container" style="display:flex; flex-wrap:wrap; gap:5px;"></div>
            </div>
        </div>
        <button onclick="addRoomRow()" style="background:var(--accent-green); color:white; border:none; padding:8px; border-radius:8px; cursor:pointer; font-size:12px;">+ เพิ่มประเภทห้องอื่น</button>

        <button class="main-btn" onclick="generate()">🔖 1. ตรวจสอบข้อมูล</button>
        <button id="sendLineBtn" onclick="submitToBackend()" style="display:none; background:#27ae60; color:white; width:100%; padding:15px; border:none; border-radius:12px; margin-top:10px; font-size:18px; cursor:pointer;">🚀 2. ยืนยันบันทึก & ส่ง LINE</button>
    </div>

    <!-- ส่วนที่ 2: ระบบจัดการการจอง (จัดการบิล) -->
    <div id="manageSection" class="sub-panel" style="display:none;">
        <h3 style="color: #2980b9;">📋 ระบบจัดการการจอง</h3>
        <button onclick="loadBookings()" style="background:#3498db; color:white; border:none; padding:10px; width:100%; border-radius:8px; margin-bottom:15px; cursor:pointer;">🔄 ดึงข้อมูลบิลล่าสุด</button>
        <div id="loadingManage" style="display:none; text-align:center;">⏳ กำลังดึงข้อมูลบิล...</div>
        <div id="bookingListContainer"></div>
    </div>

    <div id="summaryResult" style="display:none; margin-top:20px; background:#fdfaf5; padding:20px; border-radius:15px; border:1px solid #d7ccc8; white-space:pre-line;"></div>
</div>

<script>
    // 🌟 ใส่ลิงก์ให้ถูกต้องนะครับ 🌟
    const BACKEND_URL = "ลิงก์_WEB_APP_จาก_DASHBOARD_GAS"; // ตัวที่คุม PendingOrders
    const WEB_APP_URL = "ลิงก์_WEB_APP_จาก_BOOKING_GAS";   // ตัวที่ใช้บันทึกบิลและส่ง LINE

    let currentMode = 'booking';
    let currentPayload = null;
    let globalBookedRooms = {};
    const ROOM_NUMBERS = { 'std': ['1', '2', '3', '4', '5'], 'jac': ['6', '7'], 'fam': ['8', '9'], 'sea': ['10'] };
    const ROOM_DATA = { 'std': 1900, 'fam': 2900, 'sea': 2900, 'jac': 3500 };

    // --- 🌟 ระบบ Auto-fill และรองรับปุ่มดูสลิป 🌟 ---
    function checkPendingBooking() {
        const pending = sessionStorage.getItem('pendingBooking');
        if (pending) {
            const data = JSON.parse(pending);
            if(data.name) document.getElementById('custName').value = data.name;
            if(data.phone) document.getElementById('contactSource').value = data.phone;
            if(data.line) document.getElementById('lineName').value = data.line;

            document.getElementById('pendingSlipArea').innerHTML = `
                <div class="slip-preview-container">
                    <div style="flex:1;">
                        <p style="margin:0; font-weight:bold; color:#d35400;">📢 ตรวจสอบสลิปโอนเงิน</p>
                        <p style="margin:5px 0; font-size:11px;">จาก Line: <b>${data.line || '-'}</b></p>
                    </div>
                    <a href="${data.slip}" target="_blank" style="background:#f39c12; color:white; text-decoration:none; padding:10px 15px; border-radius:10px; font-weight:bold; font-size:12px;">📁 คลิกเปิดดูสลิป</a>
                    <button onclick="clearPendingData()" style="background:#eee; border:none; margin-left:10px; padding:10px; border-radius:10px; cursor:pointer;">❌</button>
                </div>
            `;
        }
    }

    window.onload = function() {
        document.querySelectorAll('.mainRoomType').forEach(sel => handleRoomTypeChange(sel));
        checkPendingBooking();
    };

    function clearPendingData() {
        sessionStorage.removeItem('pendingBooking');
        document.getElementById('pendingSlipArea').innerHTML = '';
        location.reload();
    }

    // --- 🏠 ระบบจัดการห้องพัก (Logic เดิม) ---
    function handleRoomTypeChange(selectElem) {
        const row = selectElem.closest('.room-row');
        const type = selectElem.value;
        const container = row.querySelector('.checkbox-container');
        row.querySelector('.roomPriceInput').value = ROOM_DATA[type];
        container.innerHTML = '';
        ROOM_NUMBERS[type].forEach(num => {
            container.innerHTML += `
                <label class="room-cb-label">
                    <input type="checkbox" value="${num}" onchange="updateRoomCount(this)"> ห้อง ${num}
                </label>`;
        });
        fetchBookedRooms();
    }

    function updateRoomCount(el) {
        const row = el.closest('.room-row');
        el.parentElement.classList.toggle('checked', el.checked);
        row.querySelector('.roomCount').value = row.querySelectorAll('input:checked').length;
    }

    function addRoomRow() {
        const container = document.getElementById('roomRowsContainer');
        const newRow = container.firstElementChild.cloneNode(true);
        newRow.querySelector('.roomCount').value = 0;
        newRow.querySelector('.checkbox-container').innerHTML = '';
        container.appendChild(newRow);
        handleRoomTypeChange(newRow.querySelector('.mainRoomType'));
    }

    // --- 📊 ระบบบันทึกบัญชี & จัดการบิล (แก้ไข/ยกเลิก) ---
    function switchMode(m) {
        currentMode = m;
        document.getElementById('modeBooking').classList.toggle('active', m === 'booking');
        document.getElementById('modeManage').classList.toggle('active', m === 'manage');
        document.getElementById('bookingFields').style.display = (m === 'booking') ? 'block' : 'none';
        document.getElementById('manageSection').style.display = (m === 'manage') ? 'block' : 'none';
        if(m === 'manage') loadBookings();
    }

    async function submitToBackend() {
        const btn = document.getElementById('sendLineBtn');
        btn.disabled = true; btn.innerText = "⏳ กำลังประมวลผล...";
        
        try {
            // 1. บันทึกจองหลัก
            await fetch(WEB_APP_URL, {
                method: "POST", body: JSON.stringify({ action: 'processBooking', data: currentPayload }),
                headers: { "Content-Type": "text/plain;charset=utf-8" }
            });

            // 2. 🌟 ยืนยันสถานะ Approve ใน Sheet PendingOrders (ถ้ามาจาก Dashboard) 🌟
            const pending = sessionStorage.getItem('pendingBooking');
            if (pending) {
                const data = JSON.parse(pending);
                if (data.rowId) {
                    await fetch(`${BACKEND_URL}?action=approve&rowId=${data.rowId}&admin=System_Auto`);
                }
            }

            alert("✅ บันทึกบัญชีและยิงการ์ด LINE สำเร็จ!");
            clearPendingData();
        } catch (err) {
            alert("❌ เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง");
            btn.disabled = false; btn.innerText = "🚀 ลองส่งอีกครั้ง";
        }
    }

    function loadBookings() {
        document.getElementById('loadingManage').style.display = 'block';
        fetch(WEB_APP_URL, {
            method: "POST", body: JSON.stringify({ action: 'getActiveBookings' }),
            headers: { "Content-Type": "text/plain;charset=utf-8" }
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('loadingManage').style.display = 'none';
            const container = document.getElementById('bookingListContainer');
            container.innerHTML = data.length ? '' : '<p style="text-align:center;">ไม่พบรายการบิลค้างชำระ</p>';
            data.forEach(b => {
                container.innerHTML += `
                    <div class="booking-card">
                        <h4>👤 ${b.name} (${b.contact})</h4>
                        <p>ห้อง: ${b.rooms.join(", ")} | ยอด: ฿${b.total}</p>
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;">
                            <button class="btn-edit-card" onclick="editBooking('${b.groupKey}', '${b.name}')">✏️ แก้ไขข้อมูล</button>
                            <button class="btn-delete-card" onclick="cancelBooking('${b.groupKey}', '${b.name}')">🗑️ ยกเลิกบิล</button>
                        </div>
                    </div>`;
            });
        });
    }

    function editBooking(groupKey, name) {
        if(confirm(`ยืนยันการแก้ไขข้อมูลของ ${name}? ระบบจะดึงข้อมูลมาให้กรอกใหม่ครับ`)) {
            // ในที่นี้คือการสลับหน้าให้กรอกใหม่เพื่อ Update ข้อมูลเดิมผ่าน groupKey
            switchMode('booking');
            alert("กรุณากรอกข้อมูลที่ถูกต้องแล้วกดบันทึกใหม่เพื่อ Update บิลเดิมครับ");
        }
    }

    function cancelBooking(groupKey, name) {
        if(confirm(`⚠️ ยืนยันการ "ยกเลิกบิล" ของ ${name}? ข้อมูลในระบบบัญชีจะถูกลบออกถาวร`)) {
            fetch(WEB_APP_URL, {
                method: "POST", body: JSON.stringify({ action: 'cancelBookingRecords', data: { groupKey } }),
                headers: { "Content-Type": "text/plain;charset=utf-8" }
            }).then(() => {
                alert("✅ ยกเลิกบิลเรียบร้อยแล้ว");
                loadBookings();
            });
        }
    }

    function fetchBookedRooms() {
        const cin = document.getElementById('checkIn').value;
        if(!cin) return;
        document.getElementById('loadingRooms').style.display = 'inline';
        fetch(WEB_APP_URL, {
            method: "POST", body: JSON.stringify({ action: 'getBookedRoomsDict', data: { cin: cin, cout: document.getElementById('checkOut').value || cin } }),
            headers: { "Content-Type": "text/plain;charset=utf-8" }
        }).then(res => res.json()).then(res => {
            globalBookedRooms = res;
            document.querySelectorAll('.room-cb').forEach(cb => {
                const isLocked = Object.values(res).flat().includes(cb.value);
                cb.disabled = isLocked;
                cb.parentElement.classList.toggle('locked', isLocked);
            });
            document.getElementById('loadingRooms').style.display = 'none';
        });
    }

    function generate() {
        const cin = document.getElementById('checkIn').value;
        const cout = document.getElementById('checkOut').value;
        if(!cin || !cout) return alert("⚠️ กรุณาเลือกวันที่เช็คอิน-เช็คเอาท์");

        let roomDetails = [];
        let total = 0;
        document.querySelectorAll('.room-row').forEach(row => {
            const count = parseInt(row.querySelector('.roomCount').value);
            const price = parseInt(row.querySelector('.roomPriceInput').value);
            const nums = Array.from(row.querySelectorAll('input:checked')).map(cb => cb.value);
            if(count > 0) {
                total += (count * price);
                roomDetails.push(`${nums.join(",")}`);
            }
        });

        currentPayload = {
            custName: document.getElementById('custName').value,
            contact: document.getElementById('contactSource').value,
            lineName: document.getElementById('lineName').value,
            checkInText: cin, checkOutText: cout,
            sheetRoomDisplay: roomDetails.join(","),
            netPay: total,
            channel: document.getElementById('bookingChannel').value
        };

        document.getElementById('summaryResult').innerText = `✅ ตรวจสอบความถูกต้อง:\nลูกค้า: คุณ ${currentPayload.custName}\nยอดรวมทั้งสิ้น: ${total.toLocaleString()} บาท`;
        document.getElementById('summaryResult').style.display = 'block';
        document.getElementById('sendLineBtn').style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function toggleWalkinMode() {
        const ch = document.getElementById('bookingChannel').value;
        document.getElementById('lineNameGroup').style.display = (ch === 'walkin') ? 'none' : 'block';
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจองห้องพัก | SN Kohlarn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap');
        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: #f8f5f2;
            padding: 20px 10px;
        }
        .form-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-top: 6px solid #a68b6d;
        }
    </style>
</head>
<body>

    <!-- ปุ่มกลับหน้าแรก -->
    <div class="max-w-lg mx-auto mb-4">
        <a href="index.html" class="text-[#a68b6d] font-bold hover:text-slate-700 transition">⬅️ กลับหน้าเมนูหลัก</a>
    </div>

    <div class="max-w-lg mx-auto form-container p-6">
        
        <!-- 🌟 โลโก้ SN Kohlarn 🌟 -->
        <div class="text-center mb-6 border-b-2 border-slate-100 pb-4">
            <img src="https://i.postimg.cc/zDw9HWXS/IMG-5036.jpg" alt="SN Kohlarn Logo" class="w-24 mx-auto mb-3 rounded-xl shadow-sm">
            <h2 class="text-xl font-bold text-slate-700">ระบบบันทึกการจองห้องพัก</h2>
        </div>

        <!-- ฟอร์มกรอกข้อมูล -->
        <form id="bookingForm" class="space-y-4">
            
            <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                <label class="block text-sm font-bold text-slate-700 mb-1">ประเภทการจอง</label>
                <select id="channel" class="w-full p-2 border rounded-lg focus:outline-none focus:border-[#a68b6d]">
                    <option value="online">📱 จองออนไลน์ (ส่งเข้า LINE)</option>
                    <option value="walkin">🚶‍♂️ Walk-in (ไม่ส่ง LINE)</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">ชื่อลูกค้า</label>
                    <input type="text" id="custName" class="w-full p-2 border rounded-lg" placeholder="ชื่อ-สกุล">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">เบอร์ติดต่อ</label>
                    <input type="text" id="contact" class="w-full p-2 border rounded-lg" placeholder="08X-XXX-XXXX">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">💬 ชื่อ LINE ลูกค้า (สำคัญ! ต้องพิมพ์ให้ตรง)</label>
                <input type="text" id="lineName" class="w-full p-2 border rounded-lg" placeholder="ระบุชื่อ LINE เพื่อส่งใบจอง">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">เช็คอิน</label>
                    <input type="date" id="checkIn" class="w-full p-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">เช็คเอาท์</label>
                    <input type="date" id="checkOut" class="w-full p-2 border rounded-lg">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">ห้องพักที่จอง (สรุป)</label>
                <input type="text" id="cardRoomDisplay" class="w-full p-2 border rounded-lg" placeholder="เช่น Std (1), Fam (2)">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">บริการเสริม / หมายเหตุ</label>
                <input type="text" id="extraText" class="w-full p-2 border rounded-lg" placeholder="เช่น ผู้ใหญ่เพิ่ม 1, มอไซค์ 1">
            </div>

            <div class="grid grid-cols-2 gap-4 bg-[#fff8e1] p-4 rounded-lg border border-[#ffe082]">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">มัดจำแล้ว (บาท)</label>
                    <input type="number" id="deposit" class="w-full p-2 border rounded-lg text-emerald-600 font-bold" value="0">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">ยอดชำระหน้างาน</label>
                    <input type="number" id="netPay" class="w-full p-2 border rounded-lg text-rose-600 font-bold" value="0">
                </div>
            </div>

            <button type="button" onclick="submitBooking()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl mt-4 transition shadow-md text-lg">
                🚀 ยืนยันบันทึกการจอง
            </button>
            <div id="statusMsg" class="text-center font-bold mt-2"></div>
        </form>
    </div>

    <script>
        // 🌟 ใส่ลิงก์ Web App จริงของคุณทนายเรียบร้อย 🌟
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyR86HUB7hwVqJebZy9ckbcy-n0tITmzBJSP3cBT53Xiq4Wqf_h21Yp4kPctVfwvedk/exec"; 

        function submitBooking() {
            document.getElementById("statusMsg").innerHTML = '<span class="text-blue-500">⏳ กำลังบันทึกข้อมูล...</span>';
            
            const data = {
                action: "processBooking",
                data: {
                    channel: document.getElementById("channel").value,
                    custName: document.getElementById("custName").value,
                    contact: document.getElementById("contact").value,
                    lineName: document.getElementById("lineName").value,
                    checkInText: document.getElementById("checkIn").value,
                    checkOutText: document.getElementById("checkOut").value,
                    cardRoomDisplay: document.getElementById("cardRoomDisplay").value,
                    extraText: document.getElementById("extraText").value,
                    deposit: document.getElementById("deposit").value,
                    netPay: document.getElementById("netPay").value,
                    nights: 1, 
                    dailyRooms: [ { date: document.getElementById("checkIn").value, room: document.getElementById("cardRoomDisplay").value } ],
                    benefitMotor: "none",
                    benefitBreakfast: "none"
                }
            };

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(res => {
                if(res.status === "success" || res === "SUCCESS" || res === "WALKIN_SUCCESS") {
                    document.getElementById("statusMsg").innerHTML = '<span class="text-green-600">✅ บันทึกสำเร็จ!</span>';
                    setTimeout(() => window.location.reload(), 2000);
                } else {
                    document.getElementById("statusMsg").innerHTML = '<span class="text-orange-500">⚠️ บันทึกสำเร็จ แต่ไม่พบ LINE ลูกค้า</span>';
                }
            })
            .catch(err => {
                document.getElementById("statusMsg").innerHTML = '<span class="text-red-500">❌ เกิดข้อผิดพลาดในการเชื่อมต่อ</span>';
            });
        }
    </script>
</body>
</html>
